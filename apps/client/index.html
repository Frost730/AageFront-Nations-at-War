<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agefront: Nations at War</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #050811;
        font-family: 'Inter', sans-serif;
        color: #f1f5f9;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #render-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* Marquee selection box */
      #selection-box {
        position: absolute;
        border: 1.5px solid #38bdf8;
        background-color: rgba(56, 189, 248, 0.15);
        pointer-events: none;
        display: none;
        z-index: 20;
      }
      /* Building placement ghost indicator */
      #placement-indicator {
        position: absolute;
        pointer-events: none;
        display: none;
        z-index: 25;
      }
      /* UI Root Layer */
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 30;
      }
      .interactive {
        pointer-events: auto;
      }
      /* Modal / Menu Backdrop */
      .modal-backdrop {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(5, 8, 17, 0.88);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .cinzel {
        font-family: 'Cinzel', serif;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="render-canvas"></canvas>
      <div id="selection-box"></div>
      <div id="ui-layer"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
